services:
  # ==============================================================================
  # 1. Database Service (PostgreSQL 16 Alpine)
  # ==============================================================================
  db:
    image: postgres:16-alpine
    container_name: cloudpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cloudpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cloudpulse_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cloudpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==============================================================================
  # 2. Backend API Service (NestJS + TypeORM)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpulse_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cloudpulse}?schema=public
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudpulse_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==============================================================================
  # 3. Frontend Dashboard Service (Next.js Standalone)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: cloudpulse_frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cloudpulse_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: cloudpulse_postgres_data

# ==============================================================================
# Isolated Internal Bridge Network
# ==============================================================================
networks:
  cloudpulse_net:
    name: cloudpulse_network
    driver: bridge
